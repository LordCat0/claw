name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/shared/**'
      - 'packages/web/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run translate --workspace web
        env:
          VITE_GT_API_KEY: ${{ secrets.VITE_GT_API_KEY }}
          VITE_GT_PROJECT_ID: ${{ vars.VITE_GT_PROJECT_ID }}
      - run: npm run build --workspace web -- --base "${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GT_PROJECT_ID: ${{ vars.VITE_GT_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
